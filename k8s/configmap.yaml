apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: enterprise-llm-security
  labels:
    app.kubernetes.io/name: gateway-config
    app.kubernetes.io/part-of: enterprise-llm-security-gateway
data:
  APP_ENV: "production"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "security_gateway"
  POSTGRES_USER: "gateway_user"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379/0"
  LLM_PROVIDER: "mock"
  OPENAI_MODEL: "gpt-4o-mini"
  ANTHROPIC_MODEL: "claude-3-5-sonnet-latest"
  LLM_TIMEOUT_SECONDS: "30"
  SEMANTIC_CACHE_ENABLED: "true"
  SEMANTIC_CACHE_TTL_SECONDS: "300"
  ADMIN_ALLOWED_MODELS: "mock-model,gpt-4o-mini,gpt-4,gpt-4o,claude-3-5-sonnet-latest,claude-3-haiku-20240307"
  ANALYST_ALLOWED_MODELS: "mock-model,gpt-4o-mini,claude-3-5-sonnet-latest"
  DEVELOPER_ALLOWED_MODELS: "mock-model"
  SCHEDULER_ENABLED: "false"
  SCHEDULER_POLL_INTERVAL_SECONDS: "30"
  SCHEDULER_MAX_CONCURRENT_CAMPAIGNS: "2"
  SECURITY_SCORE_ALERT_THRESHOLD: "-5.0"

