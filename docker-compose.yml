services:
  postgres:
    image: postgres:16-alpine
    container_name: security-gateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway_user} -d ${POSTGRES_DB:-security_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: security-gateway-redis
    volumes:
      - redis_data:/data
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: security-gateway-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-security_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-300}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      ADMIN_ALLOWED_MODELS: ${ADMIN_ALLOWED_MODELS:-mock-model,gpt-4o-mini,gpt-4,gpt-4o,claude-3-5-sonnet-latest,claude-3-haiku-20240307}
      ANALYST_ALLOWED_MODELS: ${ANALYST_ALLOWED_MODELS:-mock-model,gpt-4o-mini,claude-3-5-sonnet-latest}
      DEVELOPER_ALLOWED_MODELS: ${DEVELOPER_ALLOWED_MODELS:-mock-model}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-enterprise-llm-security-gateway}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-30}
      SCHEDULER_MAX_CONCURRENT_CAMPAIGNS: ${SCHEDULER_MAX_CONCURRENT_CAMPAIGNS:-2}
      SECURITY_SCORE_ALERT_THRESHOLD: ${SECURITY_SCORE_ALERT_THRESHOLD:--5.0}
    ports:

      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "curl -4 -f http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: security-gateway-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Optional Observability Services (run with: docker compose --profile observability up -d)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: security-gateway-prometheus
    profiles: ["observability", "all"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - gateway-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.108.0
    container_name: security-gateway-otel-collector
    profiles: ["observability", "all"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - gateway-network
    restart: unless-stopped

networks:
  gateway-network:
    name: gateway-network
    driver: bridge

volumes:
  postgres_data:
    name: security-gateway-postgres-data
  redis_data:
    name: security-gateway-redis-data
